<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="grid-lanes fallback column">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grid-lanes fallback column</title>
  <style>
    :root { color-scheme: light dark }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-feature-settings: "ss01";
      counter-reset: item-counter 0;
      background: light-dark(white, #222);
      color: light-dark(black, #ccc);
    }
    header {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    div {
      padding-block: 0.5rem;
      text-align: center;
      &:first-child { padding-top: 1rem }
      &:last-child {
        padding-bottom: 1rem;
        &:before { content: "\a0" }
      }
    }
    input[type="checkbox"] {vertical-align: text-top }
    main { padding-inline: 1rem }
    figure {
      position: relative;
      margin: 0;
      counter-increment: item-counter;
      body:has(input[type="checkbox"]:checked) &:after {
        content: counter(item-counter);
        position: absolute;
        top: 0;
        right: 0;
        min-width: 1ch;
        padding: 0 0.5rem 0.25rem 0.75rem;
        border-radius: 0 1rch;
        text-align: right;
        font-size: 2rem;
        opacity: 0.7;
        background: light-dark(black, white);
        color: light-dark(white, black);
      }
      body:has(input[type="checkbox"]:checked) &:nth-child(n+10):after {
        min-width: 2ch;
        padding-left: 0.5rem;
      }
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 1ch;
    }
    @supports (display: grid-lanes) {
      main {
        display: grid-lanes;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: 1rem;
      }
      div:first-child:after {
        content: " supported";
        color: light-dark(#3cd070, #5bee44);
      }
      div:nth-child(2) { display: none }
    }
    @supports not (display: grid-lanes) {
      main {
        column-width: 14rem;
        column-gap: 1rem;
      }
      figure { margin-bottom: 1rem }
      div:first-child:after {
        content: " unsupported";
        color: light-dark(#e60000, #e94957);
      }
      div:nth-child(2):before { content: "\a0" }
    }
    @media (min-width: 40rem) {
      header { flex-direction: row }
      div { padding-block: 1rem }
    }
  </style>
</head>
